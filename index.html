const fogG=lg(HZ-50,HZ,['rgba(110,40,190,0)','rgba(150,50,210,.4)']);

  const rd=(a,b)=>{g.beginPath();for(let j=a;j<=b;j++)j==a?g.moveTo(pl[j][0],pl[j][1]):g.lineTo(pl[j][0],pl[j][1]);g.stroke()};

  const a1=pl[ai-2],a2=pl[ai+2];g.fillStyle='rgba(210,235,255,.5)';g.beginPath();g.moveTo(px,HZ-p.h);g.lineTo(a1[0],a1[1]);g.lineTo((a1[0]+px)/2,a1[1]+p.h*.06);g.lineTo(px+p.w*.02,(a1[1]+a2[1])/2+p.h*.02);g.lineTo((a2[0]+px)/2,a2[1]+p.h*.06);g.lineTo(a2[0],a2[1]);g.fill();

 for(let n=0;n<=DD;n++){const z=n*SL-(pos%SL)+ZO,sc=CD/z;P[n]={x:W/2+sc*(x-pxw)*W/2,y:HZ+sc*CH*H/2,w:sc*RW*W/2,s:sc};x+=dx;dx+=segs[(bi+n)%N].c}

  if(ab==N-1||ab==N-2)qd(a,b,0,1,ab&1?'#fff':'#ff4fd8');
  for(const sd of[-1,1]){
   qd(a,b,sd*1.07,.07,alt?'#2b1650':'#24123f');
   qd(a,b,sd*.99,.1,'rgba(25,240,255,.18)');qdm(a,b,sd*.99,.034,'#06222e',.9);qdm(a,b,sd*.99,.024,'#19f0ff',.7);qdm(a,b,sd*.99,.009,'#f4ffff',.3);
   qdm(a,b,sd*1.1,.014,'#19f0ff',.5);
   qd(a,b,sd*1.17,.08,'rgba(25,240,255,.2)');qd(a,b,sd*1.17,.02,'#3df5ff');qd(a,b,sd*1.3,.06,'rgba(255,80,220,.28)');
   const o=sd*1.17,xa=a.x+a.w*o,xb=b.x+b.w*o,bm=(l,h,c)=>{g.fillStyle=c;g.beginPath();g.moveTo(xa,a.y-a.s*h*H/2);g.lineTo(xb,b.y-b.s*h*H/2);g.lineTo(xb,b.y-b.s*l*H/2);g.lineTo(xa,a.y-a.s*l*H/2);g.fill()};
   bm(285,330,alt?'#dbe1ff':'#cbd3fa');bm(250,285,'#8f99de');bm(215,250,alt?'#bac3f3':'#aab4ec');bm(195,215,'#4a52a0');bm(330,350,'#fafcff');bm(80,135,'#7c85d0');bm(186,196,'rgba(25,240,255,.7)');
   if(ab%4==0){const pw=Math.max(1.2,a.s*60*W/2),ph=a.s*370*H/2;g.fillStyle='rgba(0,0,0,.35)';g.fillRect(xa-pw*1.2,a.y-pw*.25,pw*2.4,pw*.5);g.fillStyle='#7f89d6';g.fillRect(xa-pw/2,a.y-ph,pw,ph);g.fillStyle='#e4e9ff';g.fillRect(xa-pw/2,a.y-ph,pw*.38,ph);g.fillStyle='#4a52a0';g.fillRect(xa+pw*.2,a.y-ph,pw*.3,ph);g.fillStyle='#fafcff';g.fillRect(xa-pw*.7,a.y-ph-pw*.35,pw*1.4,pw*.55);g.fillStyle=ab%8?'#19f0ff':'#ff4fd8';g.fillRect(xa-pw*.4,a.y-ph*.62,pw*.8,pw*1.1)}}
  [-.05,.05].forEach(o=>{qd(a,b,o,.05,'rgba(255,80,220,.2)');qdm(a,b,o,.03,'#2a0a3e',.9);qdm(a,b,o,.021,'#ff4fd8',.65);qdm(a,b,o,.008,'#ffe3f9',.3)});
  if(i%24==0&&hs(i+2)>.25){const h=hs(i);spr(cac[((h*3|0)*2+(hs(i*1.3+7)>.72?1:0))*2+(hs(i*2.7+3)>.5?1:0)],a.s,a.x-a.w*(2+h*.9),a.y,1150)}

 }

 g.restore();
 mg.setTransform(2,0,0,2,0,0);mg.clearRect(0,0,120,120);mg.drawImage(trk,0,0,120,120);const m=mpt[bi];

}
function hud(){const pg=(pos%L)/L*100;
 $('sc').textContent=String(score|0).padStart(6,'0');$('lv').textContent='♥ '.repeat(Math.max(0,lives)).trim();
 $('pg').style.width=pg+'%';$('pt').textContent=(pg|0)+'%';

let last=0;

 if(state==1)upd(dt);else if(state!=2)pos+=3000*dt;
