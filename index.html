<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Neon Race</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--cy:#19f0ff;--pk:#ff4fd8;--bg:#030008;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;box-sizing:border-box;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Orbitron,'Segoe UI',Arial,sans-serif;font-weight:700}
#w{position:relative;width:min(100%,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*1.7778));aspect-ratio:16/9;--u:2px;overflow:hidden}
#c{width:100%;height:100%;display:block}
#w::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at center,transparent 65%,rgba(0,0,0,.5))}
#hud{position:absolute;left:calc(var(--u)*10);top:calc(var(--u)*8);color:#ffe3f8;font-size:calc(var(--u)*7);line-height:1.8;text-shadow:0 0 6px var(--pk),0 0 14px var(--pk);z-index:2}
.bar{width:calc(var(--u)*84);height:calc(var(--u)*7);border:2px solid var(--cy);background:rgba(3,0,8,.6);box-shadow:0 0 8px var(--cy),inset 0 0 6px rgba(25,240,255,.3)}
.bar i{display:block;height:100%;width:0;background:var(--pk);box-shadow:0 0 8px var(--pk)}
#mm{position:absolute;right:calc(var(--u)*10);bottom:calc(var(--u)*10);width:calc(var(--u)*56);height:calc(var(--u)*56);border:2px solid var(--cy);border-radius:4px;background:rgba(14,0,40,.72);box-shadow:0 0 12px var(--cy);z-index:2}
#msg{position:absolute;top:22%;width:100%;text-align:center;font-size:calc(var(--u)*14);color:#fff;text-shadow:0 0 10px var(--pk),0 0 24px var(--cy);opacity:0;transition:opacity .3s;pointer-events:none;z-index:3}
button{font:inherit;color:#fff;background:linear-gradient(45deg,#ff007f,#7928ca);border:2px solid var(--cy);border-radius:8px;box-shadow:0 0 18px #ff007f;cursor:pointer}
#pb{position:absolute;top:calc(var(--u)*8);right:calc(var(--u)*10);z-index:3;font-size:calc(var(--u)*7);padding:calc(var(--u)*3) calc(var(--u)*6)}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*9);background:rgba(8,0,24,.7);text-align:center;color:#d8f6ff}
#ov h1{margin:0;font-size:calc(var(--u)*20);color:#fff;text-shadow:0 0 8px var(--pk),0 0 22px var(--pk),0 0 44px var(--cy)}
#ov p{margin:0;font-size:calc(var(--u)*5.5);line-height:2;text-shadow:0 0 8px var(--cy)}
#go{font-size:calc(var(--u)*8);padding:calc(var(--u)*6) calc(var(--u)*12)}
</style></head><body>
<div id="w"><canvas id="c"></canvas>
<div id="hud">SCORE: <span id="sc">000000</span><br>LIVES: <span id="lv" style="color:#ff3b5c"></span><br>PROGRESS: <span id="pt">0%</span><div class="bar"><i id="pg"></i></div>FUEL<div class="bar"><i id="fu" style="width:100%;background:#3dff8a"></i></div></div>
<canvas id="mm" width="240" height="240"></canvas>
<div id="msg"></div><button id="pb">II</button>
<div id="ov"><h1 id="ovh">NEON RACE</h1><p id="ovp">FLÈCHES OU INCLINAISON POUR CONDUIRE<br>ESPACE = PAUSE · MODE PAYSAGE CONSEILLÉ<br>VOIE DE GAUCHE : CIRCULATION EN SENS INVERSE</p><button id="go">LANCER LE JEU</button></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),W=480,H=270,HZ=135;

const mg=$('mm').getContext('2d');
const SS=4,mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w*SS;c.height=h*SS;const x=c.getContext('2d');x.scale(SS,SS);f(x);return c};
const R=(x,c,a,b,w,h)=>{x.fillStyle=c;x.fillRect(a,b,w,h)};
const R2=(x,c,a,b,w,h)=>{x.fillStyle=c;x.beginPath();x.roundRect(a,b,w,h,Math.min(w,h)/2.2);x.fill()};
const poly=(x,c,p)=>{x.fillStyle=c;x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.fill()};

// ---------- SPRITES PIXEL ART ----------
const cactus=t=>mk(48,80,x=>{
 const P=[[[19,8,10,70],[6,44,15,6],[6,28,6,22],[28,34,14,6],[36,18,6,22]],
  [[19,16,10,62],[28,48,14,6],[36,34,6,20],[8,42,12,6],[8,30,6,18]],
  [[19,24,10,54],[8,52,12,6],[8,40,6,18],[28,44,12,6],[34,32,6,18]]][t],
  orbs=t==1?[]:[[P[2][0]+3,P[2][1]],[P[4][0]+3,P[4][1]]];
 x.fillStyle='rgba(255,79,216,.35)';x.beginPath();x.ellipse(24,77,15,3,0,0,7);x.fill();
 x.shadowColor='#19f0ff';x.shadowBlur=10;P.forEach(p=>R2(x,'#19f0ff',p[0]-1.2,p[1]-1.2,p[2]+2.4,p[3]+2.4));x.shadowBlur=0;
 const gr=x.createLinearGradient(0,0,48,0);gr.addColorStop(0,'#6a2cc0');gr.addColorStop(.5,'#2d0b5c');gr.addColorStop(1,'#12042e');
 P.forEach(p=>R2(x,gr,...p));
 P.forEach(p=>{if(p[3]>p[2]){x.strokeStyle='rgba(25,240,255,.45)';x.lineWidth=.5;
  [.3,.62].forEach(f=>{x.beginPath();x.moveTo(p[0]+p[2]*f,p[1]+2);x.lineTo(p[0]+p[2]*f,p[1]+p[3]-2);x.stroke()});
  x.fillStyle='rgba(255,255,255,.2)';x.fillRect(p[0]+1.2,p[1]+2,1.2,p[3]-4);
  x.fillStyle='rgba(255,170,240,.85)';for(let k=p[1]+5;k<p[1]+p[3]-3;k+=6){x.fillRect(p[0]-.2,k,.7,.7);x.fillRect(p[0]+p[2]-.5,k+3,.7,.7)}}});
 orbs.forEach(o=>{const q=x.createRadialGradient(o[0],o[1]-3,0,o[0],o[1]-3,8);q.addColorStop(0,'rgba(255,230,140,.95)');q.addColorStop(.4,'rgba(255,170,40,.35)');q.addColorStop(1,'rgba(255,170,40,0)');
  x.fillStyle=q;x.beginPath();x.arc(o[0],o[1]-3,8,0,7);x.fill();x.fillStyle='#fff6c0';x.beginPath();x.arc(o[0],o[1]-3,1.6,0,7);x.fill()});
 if(t==1){x.fillStyle='#ff4fd8';x.beginPath();x.arc(24,7,2.4,0,7);x.fill();x.fillStyle='#ffd0f4';x.beginPath();x.arc(24,7,1,0,7);x.fill()}});
const cac=[cactus(0),cactus(1),cactus(2)];
const car=(b,l)=>mk(64,30,x=>{
 R(x,'rgba(25,240,255,.4)',6,26,52,3);
 R(x,'#0a0510',4,17,9,12);R(x,'#0a0510',51,17,9,12);R(x,'#4a4a7a',6,19,5,3);R(x,'#4a4a7a',53,19,5,3);
 R(x,b,2,14,60,12);R(x,'rgba(0,0,0,.28)',2,21,60,5);
 poly(x,b,[12,14,19,3,45,3,52,14]);poly(x,'#160a2c',[16,13,21,5,43,5,48,13]);
 R(x,'#6b4fa8',19,7,26,1);R(x,'#6b4fa8',18,9,28,1);R(x,'#6b4fa8',17,11,30,1);
 R(x,l,5,15,54,3);R(x,'#ffd6ee',8,16,48,1);R(x,'#e8e8f0',26,19,12,5);R(x,'#445',28,21,8,1)});
const pcar=car('#dfe3f2','#ff3d8a'),rv=[car('#7a3cff','#00e5ff'),car('#ff4fd8','#ffe14a'),car('#2fd6ff','#ff3d6a')];
const carF=b=>mk(64,30,x=>{R(x,'rgba(25,240,255,.4)',6,26,52,3);R(x,'#0a0510',4,17,9,12);R(x,'#0a0510',51,17,9,12);R(x,'#4a4a7a',6,19,5,3);R(x,'#4a4a7a',53,19,5,3);
 R(x,b,2,14,60,12);R(x,'rgba(0,0,0,.28)',2,21,60,5);poly(x,b,[12,14,19,3,45,3,52,14]);poly(x,'#1b1240',[16,13,21,5,43,5,48,13]);R(x,'rgba(255,255,255,.2)',22,6,10,5);
 x.fillStyle='rgba(255,247,192,.35)';x.beginPath();x.arc(12,18.5,8,0,7);x.arc(52,18.5,8,0,7);x.fill();
 R(x,'#fff7c0',6,16,12,5);R(x,'#fff7c0',46,16,12,5);R(x,'#222',24,20,16,4)});
const fr=[carF('#7a3cff'),carF('#ff4fd8'),carF('#2fd6ff')];
const canS=mk(18,18,x=>{x.fillStyle='rgba(255,176,0,.35)';x.beginPath();x.arc(9,9,9,0,7);x.fill();
 R(x,'#ffb000',2,2,14,14);R(x,'#25103a',4,4,10,10);R(x,'#ffd24a',6,6,5,7);R(x,'#25103a',7,7,3,2);R(x,'#ffd24a',11,8,2,4)});
const planet=mk(84,84,x=>{const q=x.createRadialGradient(30,28,4,42,42,42);q.addColorStop(0,'#b58cff');q.addColorStop(.5,'#6a3fd0');q.addColorStop(1,'#1a0c5a');
 x.fillStyle=q;x.beginPath();x.arc(42,42,40,0,7);x.fill();x.beginPath();x.arc(42,42,40,0,7);x.clip();
 x.fillStyle='rgba(20,8,70,.35)';[[26,50,9],[52,34,6],[48,58,5],[34,26,4]].forEach(c=>{x.beginPath();x.arc(c[0],c[1],c[2],0,7);x.fill()});
 x.fillStyle='rgba(120,200,255,.18)';x.fillRect(0,38,84,3);x.fillRect(0,52,84,2)});

// ---------- PISTE ALÉATOIRE (+5 % par course) ----------
const SL=200,RW=1500,CH=1100,CD=.84,DD=100,ZO=CH*CD,BASE=1500;
let segs=[],N=0,L=0,mpt=[],trk=null;
function newTrack(lv){
 const target=Math.round(BASE*Math.pow(1.05,lv-1));segs=[];
 const add=(n,c)=>{for(let i=0;i<n&&segs.length<target;i++)segs.push({c:c*.8*Math.sin(Math.PI*(i+.5)/n)})};
 add(40,0);
 while(segs.length<target-60){const n=Math.round((30+Math.random()*60)*1.5),c=Math.random()<.25?0:(Math.random()<.5?-1:1)*(1.5+Math.random()*2.5);add(Math.min(n,target-60-segs.length),c)}
 add(60,0);N=segs.length;L=N*SL;
 let hd=0,tx=0,ty=0;const pts=segs.map(s=>{hd+=s.c*.01;tx+=Math.sin(hd);ty-=Math.cos(hd);return[tx,ty]});
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mnx=Math.min(...xs),mny=Math.min(...ys),
  kk=92/Math.max(Math.max(...xs)-mnx,Math.max(...ys)-mny,1);
 mpt=pts.map(p=>[14+(p[0]-mnx)*kk,14+(p[1]-mny)*kk]);
 trk=mk(120,120,x=>{x.lineJoin=x.lineCap='round';const pa=()=>{x.beginPath();mpt.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]))};
  pa();x.strokeStyle='rgba(25,240,255,.5)';x.lineWidth=6;x.stroke();pa();x.strokeStyle='#fff';x.lineWidth=2.5;x.stroke()});
}
newTrack(1);

// ---------- DÉCOR ----------
const lg=(a,b,s)=>{const q=g.createLinearGradient(0,a,0,b);s.forEach((c,i)=>q.addColorStop(i/(s.length-1),c));return q};
const skyG=lg(0,HZ,['#02000a','#12043a','#6a1a8c']),gndG=lg(HZ,H,['#9a2fd8','#5a1790','#2b0a55']),
 hazeG=lg(HZ-26,HZ+40,['rgba(255,60,200,0)','rgba(255,70,210,.45)','rgba(255,60,200,0)']);
const stars=Array.from({length:110},()=>[Math.random()*W,Math.random()*(HZ-30),Math.random()*6]);
const mh=(u,s,p)=>{u=(u%1440+1440)%1440;return s*(8+34*Math.pow(1-Math.abs(Math.sin(Math.PI*3*u/1440+p)),1.4)+14*Math.pow(1-Math.abs(Math.sin(Math.PI*7*u/1440+p*2)),2)+5*Math.pow(1-Math.abs(Math.sin(Math.PI*19*u/1440+p*3)),3))};
const mgr=[lg(HZ-80,HZ,['#3a1585','#14083f']),lg(HZ-70,HZ,['#26106a','#0c0430']),lg(HZ-90,HZ,['#1c0a52','#070220'])];
function mount(off,s,p,gi,al){
 const q=[];for(let x=-4;x<=W+4;x+=2)q.push([x,HZ-mh(x+off,s,p)]);
 g.beginPath();g.moveTo(-4,HZ);q.forEach(a=>g.lineTo(a[0],a[1]));g.lineTo(W+4,HZ);g.fillStyle=mgr[gi];g.fill();
 for(let i=8;i<q.length-8;i++){const c=q[i],h=HZ-c[1];
  if(c[1]<q[i-1][1]&&c[1]<=q[i+1][1]&&h>22*s){const l=q[i-7],r=q[i+7];
   g.fillStyle='rgba(255,79,216,.2)';g.beginPath();g.moveTo(c[0],c[1]);g.lineTo(l[0],l[1]);g.lineTo(c[0]-8,c[1]+h*.6);g.lineTo(c[0],c[1]+h*.45);g.fill();
   g.fillStyle='rgba(0,0,12,.38)';g.beginPath();g.moveTo(c[0],c[1]);g.lineTo(r[0],r[1]);g.lineTo(c[0]+8,c[1]+h*.55);g.lineTo(c[0],c[1]+h*.45);g.fill();
   g.fillStyle='rgba(205,240,255,.4)';g.beginPath();g.moveTo(c[0],c[1]);g.lineTo(q[i-3][0],q[i-3][1]);g.lineTo(c[0]+1,c[1]+h*.14);g.lineTo(q[i+3][0],q[i+3][1]);g.fill();
   g.strokeStyle='rgba(25,240,255,.55)';g.lineWidth=.6;g.beginPath();g.moveTo(c[0],c[1]);g.lineTo(c[0],c[1]+h*.45);g.lineTo(c[0]-3,c[1]+h*.8);g.stroke()}}
 [[3.6,.25],[1.3,1]].forEach(([w,a])=>[0,1].forEach(k=>{g.beginPath();
  for(let i=0;i<q.length-1;i++)if((q[i+1][1]>q[i][1])==!!k){g.moveTo(q[i][0],q[i][1]);g.lineTo(q[i+1][0],q[i+1][1])}
  g.strokeStyle=k?'#19f0ff':'#ff4fd8';g.globalAlpha=a*al;g.lineWidth=w;g.stroke()}));g.globalAlpha=1}
const hs=i=>Math.abs(Math.sin(i*12.9898)*43758.5453)%1;
const quad=(x1,y1,w1,x2,y2,w2,c)=>{g.fillStyle=c;g.beginPath();g.moveTo(x1-w1,y1+.8);g.lineTo(x2-w2,y2);g.lineTo(x2+w2,y2);g.lineTo(x1+w1,y1+.8);g.fill()};
const qd=(a,b,o,k,c)=>quad(a.x+a.w*o,a.y,a.w*k,b.x+b.w*o,b.y,b.w*k,c);
const spr=(im,sc,x,y,ww)=>{const w=sc*ww*W/2;if(w<1.5)return;const h=w*im.height/im.width;g.drawImage(im,x-w/2,y-h,w,h)};

// ---------- ÉTAT ----------
let state=0,pos=0,px=0,speed=0,score=0,lives=3,fuel=100,level=1,invul=0,shake=0,msgT=0,skyOff=0,T=0,tR=1,tF=3,best=0,gyroOn=0,tilt=0,touch=0;
let ents=[];
try{best=+localStorage.getItem('nr')||0}catch(e){}
const K={},ov=$('ov');
const maxSp=()=>5600+level*650;
function showOv(t,p,b){$('ovh').textContent=t;$('ovp').innerHTML=p;$('go').textContent=b;ov.style.display='flex'}
function reset(){pos=0;px=0;speed=0;score=0;lives=3;fuel=100;level=1;newTrack(1);px=.5;ents=[];tR=1;tF=3;invul=0;shake=0;msgT=0}
function start(){reset();ov.style.display='none';state=1;perm()}
function pause(){if(state==1||state==2){state=3-state;if(state==2)showOv('PAUSE','','REPRENDRE');else ov.style.display='none'}}
function over(m){state=4;if(score>best){best=score;try{localStorage.setItem('nr',best|0)}catch(e){}}
 showOv(m,'SCORE '+String(score|0).padStart(6,'0')+'<br>RECORD '+String(best|0).padStart(6,'0'),'REJOUER')}
$('go').onclick=()=>state==2?pause():start();$('pb').onclick=pause;
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space'||e.code=='KeyP'){e.preventDefault();pause()}});
addEventListener('keyup',e=>K[e.code]=0);
const wr=$('w'),pz=e=>{if(e.target.tagName=='BUTTON')return;const r=wr.getBoundingClientRect(),f=(e.clientX-r.left)/r.width;touch=f<.4?-1:f>.6?1:0};
wr.addEventListener('pointerdown',pz);wr.addEventListener('pointermove',e=>{if(e.buttons)pz(e)});
['pointerup','pointercancel','pointerleave'].forEach(v=>wr.addEventListener(v,()=>touch=0));
function gyro(e){const b=e.beta,m=e.gamma;if(b==null||m==null)return;const a=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
 const v=a==90?-b:(a==270||a==-90)?b:m;tilt=Math.max(-1,Math.min(1,v/22));if(Math.abs(tilt)<.08)tilt=0}
function perm(){if(gyroOn)return;const D=window.DeviceOrientationEvent;
 if(D&&D.requestPermission)D.requestPermission().then(r=>{if(r=='granted'){addEventListener('deviceorientation',gyro);gyroOn=1}}).catch(()=>{});
 else if(D){addEventListener('deviceorientation',gyro);gyroOn=1}}
const steer=()=>((K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0))||touch||tilt;

// ---------- MISE À JOUR ----------
function upd(dt){
 const seg=segs[(pos/SL|0)%N],mx=maxSp(),lim=mx;
 speed+=(lim-speed)*Math.min(1,dt*1.6);const sp=speed/mx;
 px+=steer()*dt*2.2-dt*2*sp*sp*seg.c*.3;const wall=Math.abs(px)>.8;px=Math.max(-.8,Math.min(.8,px));if(wall){speed*=1-dt*.8;shake=Math.max(shake,.15)}
 pos+=speed*dt;skyOff+=seg.c*sp*dt*60;score+=speed*dt*.01;fuel-=dt*3;
 shake=Math.max(0,shake-dt);invul=Math.max(0,invul-dt);msgT-=dt;
 if(pos>=L){level++;newTrack(level);pos=0;ents=[];score+=1000;const up=lives<5;lives=Math.min(5,lives+1);$('msg').textContent='COURSE '+level+(up?' · +1 VIE':'');msgT=2.2}
 $('msg').style.opacity=msgT>0?1:0;
 if((tR-=dt)<=0){tR=Math.max(.45,1.1-level*.06)*(.7+Math.random()*.6);const on=Math.random()<.5;ents.push({k:0,z:pos+DD*SL*.98,x:(on?-1:1)*(.22+Math.random()*.55),v:on?-(.3+Math.random()*.2)*mx:(.35+Math.random()*.3)*mx,s:Math.random()*3|0})}
 if((tF-=dt)<=0){tF=5;ents.push({k:1,z:pos+DD*SL*.98,x:Math.random()*1.6-.8})}
 for(let i=ents.length-1;i>=0;i--){const e=ents[i];if(e.k==0)e.z+=e.v*dt;const dz=e.z-pos;
  if(dz<-300){ents.splice(i,1);if(e.k==0)score+=50;continue}
  if(dz<260&&dz>-200&&Math.abs(e.x-px)<.34){ents.splice(i,1);
   if(e.k==1){fuel=100;score+=200}
   else if(!invul){lives--;invul=1.6;speed*=.4;shake=.5;if(lives<=0)return over('GAME OVER')}}}
 if(fuel<=0){fuel=0;over("PANNE D'ESSENCE")}
}

// ---------- RENDU ----------
function draw(t){
 g.setTransform(cv.width/W,0,0,cv.height/H,0,0);g.save();if(shake>0)g.translate((Math.random()-.5)*5*shake,(Math.random()-.5)*5*shake);
 g.fillStyle=skyG;g.fillRect(-4,-4,W+8,HZ+5);
 stars.forEach((s,i)=>{g.fillStyle=`rgba(255,255,255,${.45+.45*Math.sin(t*2+i)})`;g.fillRect(s[0],s[1],s[2]>5?2:1,s[2]>5?2:1)});
 g.drawImage(planet,350-30*Math.sin(skyOff*.002),22);
 mount(skyOff*.18,.75,5,2,.55);mount(skyOff*.4,1,0,0,.8);mount(skyOff*.75,1.3,2,1,1);
 g.fillStyle=gndG;g.fillRect(-4,HZ,W+8,H-HZ+4);
 const fl=pos/SL|0,bi=fl%N,pr=(pos%SL)/SL,pxw=px*RW,P=[];
 let x=0,dx=-segs[bi].c*pr;
 for(let n=0;n<=DD;n++){const z=n*SL-(pos%SL)+ZO,sc=CD/z;P[n]={x:W/2+sc*(x-pxw)*W/2,y:HZ+sc*CH*H/2,w:sc*RW*W/2,s:sc};x+=dx;dx+=segs[(bi+n)%N].c}
 const B=[];ents.forEach(e=>{const n=(e.z/SL|0)-fl;if(n>=0&&n<DD)(B[n]=B[n]||[]).push(e)});
