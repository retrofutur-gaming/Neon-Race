<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Synthwave Race 80s</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05000a;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #00ffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 6px #00ffff;
            z-index: 10;
            line-height: 1.4;
            user-select: none;
        }
        .hearts {
            color: #ff0055;
            text-shadow: 0 0 6px #ff0055;
        }
        #fuelContainer {
            width: 150px;
            height: 10px;
            border: 2px solid #ffaa00;
            margin-top: 4px;
            background: rgba(0,0,0,0.5);
            box-shadow: 0 0 6px #ffaa00;
        }
        #fuelBar {
            width: 100%;
            height: 100%;
            background: #ffaa00;
            box-shadow: 0 0 8px #ffaa00;
        }
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            border: 2px solid #00ffff;
            background: rgba(10, 0, 20, 0.7);
            box-shadow: 0 0 10px #00ffff;
            border-radius: 8px;
            z-index: 10;
        }
        #permissionBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: 2px solid #00ffff;
            border-radius: 12px;
            box-shadow: 0 0 20px #ff007f;
            cursor: pointer;
            z-index: 20;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        SCORE: <span id="score">000000</span><br>
        LIVES: <span id="lives" class="hearts">♥♥♥</span><br>
        PROGRESS: <span id="progressText">0%</span><br>
        FUEL: <span id="fuelText">100%</span>
        <div id="fuelContainer"><div id="fuelBar"></div></div>
    </div>

    <canvas id="minimap" width="100" height="100"></canvas>

    <button id="permissionBtn">LANCER LE JEU</button>

    <script>
        // --- SCÈNE 3D ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0015, 0.008);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- CIEL ÉTOILÉ ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 400;
        const starPos = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i+=3) {
            starPos[i] = (Math.random() - 0.5) * 400;
            starPos[i+1] = Math.random() * 100 + 10;
            starPos[i+2] = -Math.random() * 200 - 50;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
        scene.add(new THREE.Points(starsGeo, starsMat));

        // --- PLANÈTE VIOLETTE ---
        const planetGeo = new THREE.SphereGeometry(35, 32, 32);
        const planetMat = new THREE.MeshBasicMaterial({ color: 0x8a2be2, wireframe: true });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        planet.position.set(60, 25, -180);
        scene.add(planet);

        // --- MONTAGNES NÉON ---
        function createMountain(x, z, scaleY) {
            const geo = new THREE.ConeGeometry(30, scaleY, 4);
            const mat = new THREE.MeshBasicMaterial({ color: 0x4a00e0, wireframe: true });
            const mtn = new THREE.Mesh(geo, mat);
            mtn.position.set(x, scaleY/2, z);
            scene.add(mtn);
        }
        createMountain(-80, -160, 45);
        createMountain(-40, -180, 55);
        createMountain(110, -170, 50);

        // --- ROUTE DROITE ET GOUDRON NOIR ---
        const roadWidth = 14;
        const roadLength = 500;
        const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, 0, -roadLength / 2 + 20);
        scene.add(road);

        // --- DOUBLE LIGNE VIOLETTE CENTRALE ---
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xaa00ff });

        const leftLineGeo = new THREE.PlaneGeometry(0.3, roadLength);
        const leftLine = new THREE.Mesh(leftLineGeo, lineMat);
        leftLine.rotation.x = -Math.PI / 2;
        leftLine.position.set(-0.35, 0.05, -roadLength / 2 + 20);
        scene.add(leftLine);

        const rightLineGeo = new THREE.PlaneGeometry(0.3, roadLength);
        const rightLine = new THREE.Mesh(rightLineGeo, lineMat);
        rightLine.rotation.x = -Math.PI / 2;
        rightLine.position.set(0.35, 0.05, -roadLength / 2 + 20);
        scene.add(rightLine);

        // Barrières cyan
        const railMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 4 });
        
        const leftRailPoints = [new THREE.Vector3(-roadWidth / 2, 0.3, 20), new THREE.Vector3(-roadWidth / 2, 0.3, -roadLength + 20)];
        const leftRail = new THREE.Line(new THREE.BufferGeometry().setFromPoints(leftRailPoints), railMat);
        scene.add(leftRail);

        const rightRailPoints = [new THREE.Vector3(roadWidth / 2, 0.3, 20), new THREE.Vector3(roadWidth / 2, 0.3, -roadLength + 20)];
        const rightRail = new THREE.Line(new THREE.BufferGeometry().setFromPoints(rightRailPoints), railMat);
        scene.add(rightRail);

        // --- CACTUS ---
        const cacti = [];
        function createCactus(x, z) {
            const group = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
            
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5), mat);
            group.add(trunk);
            const arm = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 0.3), mat);
            arm.position.y = 1;
            group.add(arm);

            group.position.set(x, 2.5, z);
            scene.add(group);
            cacti.push(group);
        }

        for (let z = 0; z > -350; z -= 30) {
            createCactus(-18, z);
            createCactus(18, z);
        }

        // --- VOITURE ---
        const carGroup = new THREE.Group();
        
        const bodyGeo = new THREE.BoxGeometry(2.4, 0.7, 4.5);
        const bodyMat = new THREE.MeshBasicMaterial({ color: 0xdcdcdc });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.5;
        carGroup.add(carBody);

        const lightsGeo = new THREE.BoxGeometry(2.2, 0.2, 0.1);
        const lightsMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        const rearLights = new THREE.Mesh(lightsGeo, lightsMat);
        rearLights.position.set(0, 0.6, 2.26);
        carGroup.add(rearLights);

        carGroup.position.set(0, 0, -8);
        scene.add(carGroup);

        camera.position.set(0, 3.5, 3);
        camera.lookAt(0, 1, -15);

        // --- ÉTAT DU JEU ---
        let gameStarted = false;
        let score = 0;
        let lives = 3;
        let progress = 0;
        let fuel = 100;
        let isGameOver = false;
        let targetX = 0;
        let invulnerable = false;
        const keys = { ArrowLeft: false, ArrowRight: false };

        // --- OBSTACLES & JERRICANS ---
        const obstacles = [];
        const fuelCans = [];

        function spawnObstacle() {
            if (!gameStarted || isGameOver) return;
            const obsGeo = new THREE.BoxGeometry(2, 2, 2);
            const obsMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
            const obstacle = new THREE.Mesh(obsGeo, obsMat);
            
            const randomX = (Math.random() - 0.5) * 10;
            obstacle.position.set(randomX, 1, -180);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }
        setInterval(spawnObstacle, 1100);

        function createFuelCanMesh() {
            const group = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.8), mat);
            group.add(body);
            
            const cap = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.4), mat);
            cap.position.set(0.3, 0.95, 0);
            group.add(cap);

            return group;
        }

        function spawnFuelCan() {
            if (!gameStarted || isGameOver) return;
            const can = createFuelCanMesh();
            const randomX = (Math.random() - 0.5) * 10;
            can.position.set(randomX, 0.9, -180);
            scene.add(can);
            fuelCans.push(can);
        }
        setInterval(spawnFuelCan, 4500);

        function updateHUD() {
            document.getElementById('score').textContent = String(Math.floor(score)).padStart(6, '0');
            document.getElementById('lives').textContent = '♥'.repeat(Math.max(0, lives));
            document.getElementById('progressText').textContent = Math.floor(progress) + '%';
            
            const displayFuel = Math.max(0, Math.floor(fuel));
            document.getElementById('fuelText').textContent = displayFuel + '%';
            document.getElementById('fuelBar').style.width = displayFuel + '%';
        }
        updateHUD();

        // --- MINI MAP ---
        const mapCanvas = document.getElementById('minimap');
        const mapCtx = mapCanvas.getContext('2d');

        function drawMinimap() {
            mapCtx.clearRect(0, 0, 100, 100);
            
            mapCtx.strokeStyle = '#00ffff';
            mapCtx.lineWidth = 3;
            mapCtx.beginPath();
            mapCtx.moveTo(50, 90);
            mapCtx.lineTo(50, 10);
            mapCtx.stroke();

            const mapX = 50 + carGroup.position.x * 2;
            mapCtx.fillStyle = '#ff0055';
            mapCtx.beginPath();
            mapCtx.arc(Math.max(10, Math.min(90, mapX)), 75, 4, 0, Math.PI * 2);
            mapCtx.fill();
        }

        window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // --- RÉINITIALISATION DU JEU ---
        function resetGame() {
            // Nettoyer les objets existants
            obstacles.forEach(obs => scene.remove(obs));
            obstacles.length = 0;

            fuelCans.forEach(can => scene.remove(can));
            fuelCans.length = 0;

            // Réinitialiser les variables
            score = 0;
            lives = 3;
            progress = 0;
            fuel = 100;
            targetX = 0;
            carGroup.position.x = 0;
            carGroup.rotation.z = 0;
            isGameOver = false;
            invulnerable = false;

            updateHUD();
        }

        // --- DÉMARRAGE SÉCURISÉ ---
        const btn = document.getElementById('permissionBtn');
        
        function startGame() {
            resetGame();
            btn.style.display = 'none';
            gameStarted = true;

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') window.addEventListener('deviceorientation', handleGyro);
                }).catch(() => {});
            } else {
                window.addEventListener('deviceorientation', handleGyro);
            }
        }

        btn.addEventListener('click', startGame);
        btn.addEventListener('touchstart', startGame);

        function handleGyro(event) {
            if (event.gamma !== null) {
                targetX = event.gamma * 0.3;
            }
        }

        function triggerGameOver(reason) {
            isGameOver = true;
            gameStarted = false;

            setTimeout(() => {
                alert(reason + "\nScore final : " + String(Math.floor(score)).padStart(6, '0'));
                btn.textContent = "REJOUER";
                btn.style.display = 'block';
            }, 50);
        }

        // --- ANIMATION ---
        const speed = 2.2;

        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted || isGameOver) {
                drawMinimap();
                renderer.render(scene, camera);
                return;
            }

            cacti.forEach(c => {
                c.position.z += speed;
                if (c.position.z > 10) c.position.z = -350;
            });

            if (keys.ArrowLeft) targetX -= 0.4;
            if (keys.ArrowRight) targetX += 0.4;

            targetX = Math.max(-5.5, Math.min(5.5, targetX));
            carGroup.position.x += (targetX - carGroup.position.x) * 0.1;
            carGroup.rotation.z = (carGroup.position.x - targetX) * 0.05;

            progress += 0.03;
            if (progress >= 100) progress = 100;

            fuel -= 0.05;
            if (fuel <= 0) {
                fuel = 0;
                updateHUD();
                triggerGameOver("PANNE D'ESSENCE !");
                return;
            }
            updateHUD();

            for (let i = fuelCans.length - 1; i >= 0; i--) {
                const can = fuelCans[i];
                can.position.z += speed;
                can.rotation.y += 0.03;

                const dx = Math.abs(carGroup.position.x - can.position.x);
                const dz = Math.abs(carGroup.position.z - can.position.z);

                if (dx < 1.8 && dz < 2.0) {
                    fuel = 100;
                    updateHUD();
                    scene.remove(can);
                    fuelCans.splice(i, 1);
                    continue;
                }

                if (can.position.z > 5) {
                    scene.remove(can);
                    fuelCans.splice(i, 1);
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                const dx = Math.abs(carGroup.position.x - obs.position.x);
                const dz = Math.abs(carGroup.position.z - obs.position.z);

                if (dx < 1.8 && dz < 2.0 && !invulnerable) {
                    lives--;
                    updateHUD();
                    scene.remove(obs);
                    obstacles.splice(i, 1);

                    invulnerable = true;
                    setTimeout(() => { invulnerable = false; }, 1000);

                    if (lives <= 0) {
                        triggerGameOver("GAME OVER !");
                        return;
                    }
                    continue;
                }

                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 50;
                    updateHUD();
                }
            }

            drawMinimap();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
