<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Synthwave Race 80s</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05000a;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }
        /* Effet scanlines CRT */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #ff00ff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 8px #ff00ff, 0 0 15px #00ffff;
            z-index: 10;
            line-height: 1.5;
            user-select: none;
        }
        .hearts {
            color: #ff0055;
            text-shadow: 0 0 8px #ff0055;
        }
        #fuelContainer {
            width: 160px;
            height: 12px;
            border: 2px solid #00ffff;
            margin-top: 5px;
            background: rgba(0,0,0,0.7);
            box-shadow: 0 0 8px #00ffff;
        }
        #fuelBar {
            width: 100%;
            height: 100%;
            background: #ff007f;
            box-shadow: 0 0 10px #ff007f;
        }
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 110px;
            height: 110px;
            border: 2px solid #00ffff;
            background: rgba(15, 0, 30, 0.85);
            box-shadow: 0 0 12px #00ffff;
            border-radius: 6px;
            z-index: 10;
        }
        #permissionBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 32px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: 2px solid #00ffff;
            border-radius: 12px;
            box-shadow: 0 0 25px #ff007f;
            cursor: pointer;
            z-index: 20;
        }
        #pauseMenu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #00ffff;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 0 0 12px #00ffff;
            z-index: 30;
            background: rgba(10, 0, 20, 0.9);
            padding: 35px 55px;
            border: 2px solid #ff007f;
            border-radius: 12px;
            box-shadow: 0 0 25px #ff007f;
            user-select: none;
        }
        #resumeBtn {
            margin-top: 20px;
            padding: 12px 26px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: 2px solid #00ffff;
            border-radius: 8px;
            box-shadow: 0 0 12px #00ffff;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        SCORE: <span id="score">000000</span><br>
        LIVES: <span id="lives" class="hearts">♥♥♥</span><br>
        FUEL: <span id="fuelText">100%</span>
        <div id="fuelContainer"><div id="fuelBar"></div></div>
    </div>

    <canvas id="minimap" width="110" height="110"></canvas>

    <button id="permissionBtn">LANCER LE JEU</button>

    <div id="pauseMenu">
        PAUSE<br>
        <button id="resumeBtn">REPRENDRE</button>
    </div>

    <script>
        // --- SCÈNE 3D ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a002b, 0.007);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- ÉCLAIRAGE NÉON ---
        const ambientLight = new THREE.AmbientLight(0xff00aa, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ffff, 1.2);
        dirLight.position.set(0, 50, -100);
        scene.add(dirLight);

        // --- CIEL ÉTOILÉ & BRUME VIOLETTE ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 600;
        const starPos = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i+=3) {
            starPos[i] = (Math.random() - 0.5) * 500;
            starPos[i+1] = Math.random() * 120 + 5;
            starPos[i+2] = -Math.random() * 250 - 20;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.9 });
        scene.add(new THREE.Points(starsGeo, starsMat));

        // --- PLANÈTE / SOLEIL RÉTRO STYLISÉ ---
        const planetGeo = new THREE.SphereGeometry(30, 32, 32);
        const planetMat = new THREE.MeshBasicMaterial({ color: 0x8000ff, wireframe: true });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        planet.position.set(45, 20, -180);
        scene.add(planet);

        // --- MONTAGNES NÉON AVEC SOMMETS LUMINEUX ---
        function createMountainGroup(x, z, radius, height) {
            const group = new THREE.Group();
            
            const geo = new THREE.ConeGeometry(radius, height, 5);
            const mat = new THREE.MeshBasicMaterial({ color: 0x3d0066, wireframe: true });
            const mtn = new THREE.Mesh(geo, mat);
            group.add(mtn);

            const topGeo = new THREE.ConeGeometry(radius * 0.4, height * 0.4, 5);
            const topMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
            const topMtn = new THREE.Mesh(topGeo, topMat);
            topMtn.position.y = height * 0.3;
            group.add(topMtn);

            group.position.set(x, height/2, z);
            scene.add(group);
        }

        createMountainGroup(-90, -160, 35, 55);
        createMountainGroup(-45, -190, 45, 70);
        createMountainGroup(95, -170, 40, 60);

        // --- SOL ET GRILLE SYNTHWAVE ---
        const floorGeo = new THREE.PlaneGeometry(400, 500, 40, 50);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x110022, wireframe: true });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, -0.2, -200);
        scene.add(floor);

        // --- ROUTE SINUEUSE AVEC COURBE ---
        const roadSegments = 200;
        const roadWidth = 14;
        const roadCurvePoints = [];

        for (let i = 0; i <= roadSegments; i++) {
            const z = -i * 2.5;
            const x = Math.sin(i * 0.08) * 12;
            roadCurvePoints.push(new THREE.Vector3(x, 0, z));
        }

        const curve = new THREE.CatmullRomCurve3(roadCurvePoints);
        const roadGeo = new THREE.PlaneGeometry(roadWidth, 500, 1, roadSegments);
        
        // Incurver la route le long des points
        const pos = roadGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const zIdx = Math.floor(i / 2);
            const t = zIdx / roadSegments;
            const pt = curve.getPoint(t);
            pos.setX(i, pos.getX(i) + pt.x);
        }
        roadGeo.computeVertexNormals();

        const roadMat = new THREE.MeshBasicMaterial({ color: 0x0a0015, side: THREE.DoubleSide });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, 0.01, 0);
        scene.add(road);

        // Bordures violettes lumineuses
        const railMat = new THREE.LineBasicMaterial({ color: 0xff00ff, linewidth: 3 });
        const leftRailPoints = [];
        const rightRailPoints = [];

        for (let i = 0; i <= roadSegments; i++) {
            const t = i / roadSegments;
            const pt = curve.getPoint(t);
            leftRailPoints.push(new THREE.Vector3(pt.x - roadWidth / 2, 0.2, pt.z));
            rightRailPoints.push(new THREE.Vector3(pt.x + roadWidth / 2, 0.2, pt.z));
        }

        const leftRail = new THREE.Line(new THREE.BufferGeometry().setFromPoints(leftRailPoints), railMat);
        const rightRail = new THREE.Line(new THREE.BufferGeometry().setFromPoints(rightRailPoints), railMat);
        scene.add(leftRail);
        scene.add(rightRail);

        // --- CACTUS STYLE SAGUARO LUMINEUX ---
        const cacti = [];
        function createNeonCactus(x, z) {
            const group = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
            
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 6, 8), mat);
            group.add(trunk);

            const arm1 = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 0.4), mat);
            arm1.position.set(0.9, 1.2, 0);
            group.add(arm1);

            const arm1Up = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2, 8), mat);
            arm1Up.position.set(1.8, 2, 0);
            group.add(arm1Up);

            const arm2 = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 0.4), mat);
            arm2.position.set(-0.9, 0.2, 0);
            group.add(arm2);

            const arm2Up = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2, 8), mat);
            arm2Up.position.set(-1.8, 1, 0);
            group.add(arm2Up);

            group.position.set(x, 3, z);
            scene.add(group);
            cacti.push(group);
        }

        for (let z = 0; z > -400; z -= 25) {
            createNeonCactus(-20, z);
            createNeonCactus(20, z);
        }

        // --- VOITURE STYLE DELOREAN ---
        const carGroup = new THREE.Group();
        
        // Carrosserie argentée/métallique
        const bodyGeo = new THREE.BoxGeometry(2.5, 0.6, 4.6);
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0xcccccc, specular: 0x00ffff, shininess: 40 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.6;
        carGroup.add(carBody);

        // Toit
        const roofGeo = new THREE.BoxGeometry(2.0, 0.5, 2.2);
        const roofMat = new THREE.MeshPhongMaterial({ color: 0x333333, specular: 0xff00ff });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, 1.1, -0.2);
        carGroup.add(roof);

        // Bandes néon
        const stripeGeo = new THREE.BoxGeometry(2.52, 0.1, 4.62);
        const stripeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const stripe = new THREE.Mesh(stripeGeo, stripeMat);
        stripe.position.y = 0.5;
        carGroup.add(stripe);

        // Feux arrière rouges/roses
        const lightsGeo = new THREE.BoxGeometry(2.2, 0.2, 0.1);
        const lightsMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        const rearLights = new THREE.Mesh(lightsGeo, lightsMat);
        rearLights.position.set(0, 0.7, 2.31);
        carGroup.add(rearLights);

        carGroup.position.set(0, 0, -8);
        scene.add(carGroup);

        camera.position.set(0, 3.8, 3.5);
        camera.lookAt(0, 1.2, -15);

        // --- ÉTAT DU JEU ---
        let gameStarted = false;
        let isPaused = false;
        let score = 0;
        let lives = 3;
        let fuel = 100;
        let isGameOver = false;
        let targetX = 0;
        let invulnerable = false;
        const keys = { ArrowLeft: false, ArrowRight: false };

        // --- OBSTACLES & JERRICANS ---
        const obstacles = [];
        const fuelCans = [];

        function spawnObstacle() {
            if (!gameStarted || isGameOver || isPaused) return;
            const obsGeo = new THREE.BoxGeometry(2, 2, 2);
            const obsMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
            const obstacle = new THREE.Mesh(obsGeo, obsMat);
            
            const randomX = (Math.random() - 0.5) * 10;
            obstacle.position.set(randomX, 1, -180);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }
        setInterval(spawnObstacle, 1100);

        function createFuelCanMesh() {
            const group = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.8), mat);
            group.add(body);
            
            const cap = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.4), mat);
            cap.position.set(0.3, 0.95, 0);
            group.add(cap);

            return group;
        }

        function spawnFuelCan() {
            if (!gameStarted || isGameOver || isPaused) return;
            const can = createFuelCanMesh();
            const randomX = (Math.random() - 0.5) * 10;
            can.position.set(randomX, 0.9, -180);
            scene.add(can);
            fuelCans.push(can);
        }
        setInterval(spawnFuelCan, 4500);

        function updateHUD() {
            document.getElementById('score').textContent = String(Math.floor(score)).padStart(6, '0');
            document.getElementById('lives').textContent = '♥'.repeat(Math.max(0, lives));
            
            const displayFuel = Math.max(0, Math.floor(fuel));
            document.getElementById('fuelText').textContent = displayFuel + '%';
            document.getElementById('fuelBar').style.width = displayFuel + '%';
        }
        updateHUD();

        // --- MINI MAP ---
        const mapCanvas = document.getElementById('minimap');
        const mapCtx = mapCanvas.getContext('2d');

        function drawMinimap() {
            mapCtx.clearRect(0, 0, 110, 110);
            
            // Ligne de route sinueuse sur la carte
            mapCtx.strokeStyle = '#00ffff';
            mapCtx.lineWidth = 3;
            mapCtx.beginPath();
            for (let i = 0; i < 100; i += 5) {
                const mapY = 100 - i;
                const mapX = 55 + Math.sin(i * 0.1) * 15;
                if (i === 0) mapCtx.moveTo(mapX, mapY);
                else mapCtx.lineTo(mapX, mapY);
            }
            mapCtx.stroke();

            // Position de la voiture
            const carMapX = 55 + carGroup.position.x * 2.5;
            mapCtx.fillStyle = '#ff007f';
            mapCtx.beginPath();
            mapCtx.arc(Math.max(10, Math.min(100, carMapX)), 85, 5, 0, Math.PI * 2);
            mapCtx.fill();
        }

        // --- GESTION DE LA PAUSE ---
        const pauseMenu = document.getElementById('pauseMenu');
        const resumeBtn = document.getElementById('resumeBtn');

        function togglePause() {
            if (!gameStarted || isGameOver) return;
            isPaused = !isPaused;
            pauseMenu.style.display = isPaused ? 'block' : 'none';
        }

        resumeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePause();
        });

        window.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePause();
                return;
            }
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });

        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        window.addEventListener('pointerdown', e => {
            if (!gameStarted || isGameOver || isPaused) return;
            if (e.target.tagName === 'BUTTON' || e.target.closest('#hud') || e.target.closest('#minimap')) return;
            togglePause();
        });

        // --- RÉINITIALISATION DU JEU ---
        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles.length = 0;

            fuelCans.forEach(can => scene.remove(can));
            fuelCans.length = 0;

            score = 0;
            lives = 3;
            fuel = 100;
            targetX = 0;
            carGroup.position.x = 0;
            carGroup.rotation.z = 0;
            isGameOver = false;
            isPaused = false;
            invulnerable = false;

            pauseMenu.style.display = 'none';
            updateHUD();
        }

        // --- DÉMARRAGE SÉCURISÉ ---
        const btn = document.getElementById('permissionBtn');
        
        function startGame(e) {
            if (e) e.stopPropagation();
            resetGame();
            btn.style.display = 'none';
            gameStarted = true;

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') window.addEventListener('deviceorientation', handleGyro);
                }).catch(() => {});
            } else {
                window.addEventListener('deviceorientation', handleGyro);
            }
        }

        btn.addEventListener('click', startGame);

        function handleGyro(event) {
            if (event.gamma !== null && !isPaused) {
                targetX = event.gamma * 0.3;
            }
        }

        function triggerGameOver(reason) {
            isGameOver = true;
            gameStarted = false;

            setTimeout(() => {
                alert(reason + "\nScore final : " + String(Math.floor(score)).padStart(6, '0'));
                btn.textContent = "REJOUER";
                btn.style.display = 'block';
            }, 50);
        }

        // --- ANIMATION ---
        const speed = 2.2;

        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted || isGameOver || isPaused) {
                drawMinimap();
                renderer.render(scene, camera);
                return;
            }

            cacti.forEach(c => {
                c.position.z += speed;
                if (c.position.z > 10) c.position.z = -400;
            });

            if (keys.ArrowLeft) targetX -= 0.4;
            if (keys.ArrowRight) targetX += 0.4;

            targetX = Math.max(-5.5, Math.min(5.5, targetX));
            carGroup.position.x += (targetX - carGroup.position.x) * 0.1;
            carGroup.rotation.z = (carGroup.position.x - targetX) * 0.05;

            fuel -= 0.05;
            if (fuel <= 0) {
                fuel = 0;
                updateHUD();
                triggerGameOver("PANNE D'ESSENCE !");
                return;
            }
            updateHUD();

            for (let i = fuelCans.length - 1; i >= 0; i--) {
                const can = fuelCans[i];
                can.position.z += speed;
                can.rotation.y += 0.03;

                const dx = Math.abs(carGroup.position.x - can.position.x);
                const dz = Math.abs(carGroup.position.z - can.position.z);

                if (dx < 1.8 && dz < 2.0) {
                    fuel = 100;
                    updateHUD();
                    scene.remove(can);
                    fuelCans.splice(i, 1);
                    continue;
                }

                if (can.position.z > 5) {
                    scene.remove(can);
                    fuelCans.splice(i, 1);
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                const dx = Math.abs(carGroup.position.x - obs.position.x);
                const dz = Math.abs(carGroup.position.z - obs.position.z);

                if (dx < 1.8 && dz < 2.0 && !invulnerable) {
                    lives--;
                    updateHUD();
                    scene.remove(obs);
                    obstacles.splice(i, 1);

                    invulnerable = true;
                    setTimeout(() => { invulnerable = false; }, 1000);

                    if (lives <= 0) {
                        triggerGameOver("GAME OVER !");
                        return;
                    }
                    continue;
                }

                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 50;
                    updateHUD();
                }
            }

            drawMinimap();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
